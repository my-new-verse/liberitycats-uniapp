<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面不存在 - 404</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
        color: #333;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        width: 100%;
      }

      .title-404 {
        font-size: 90px;
        font-weight: 900;
        color: #409eff;
        opacity: 0.9;
        animation: float 3s ease-in-out infinite;
        line-height: 1;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 22px;
        color: #555;
        margin-bottom: 12px;
        font-weight: 500;
      }

      .desc {
        font-size: 16px;
        color: #888;
        margin-bottom: 32px;
        line-height: 1.6;
      }

      .back-btn {
        display: inline-block;
        padding: 12px 30px;
        background-color: #409eff;
        color: #fff;
        border-radius: 50px;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        box-shadow: 0 6px 16px rgba(64, 158, 255, 0.25);
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
      }

      .back-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(64, 158, 255, 0.3);
        background-color: #338eff;
      }

      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-12px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      @media (max-width: 500px) {
        .title-404 {
          font-size: 70px;
        }
        .subtitle {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title-404">404</div>
      <div class="subtitle">页面不见了</div>
      <div class="desc">你访问的页面不存在或已被移动，请检查链接后重试</div>
      <!-- <button class="back-btn" onclick="history.back()">返回上一页</button> -->
    </div>
  </body>
</html>
